# Jalankan:  cp .env.example .env  (isi AUTH_SECRET)  lalu  docker compose up --build
# Isi data contoh (opsional, sekali saja):  docker compose --profile seed run --rm seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lisaan
      POSTGRES_PASSWORD: lisaan
      POSTGRES_DB: lisaan
    volumes:
      - lisaan-db:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lisaan -d lisaan']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: build }
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://lisaan:lisaan@db:5432/lisaan
    depends_on:
      db: { condition: service_healthy }

  seed:
    profiles: ['seed']
    build: { context: ., target: build }
    command: npm run db:seed
    environment:
      DATABASE_URL: postgresql://lisaan:lisaan@db:5432/lisaan
    depends_on:
      migrate: { condition: service_completed_successfully }

  app:
    build: { context: ., target: run }
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://lisaan:lisaan@db:5432/lisaan
      AUTH_SECRET: ${AUTH_SECRET:?Isi AUTH_SECRET di file .env (openssl rand -base64 32)}
      AUTH_TRUST_HOST: 'true'
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  lisaan-db:
